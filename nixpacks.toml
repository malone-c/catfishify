providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
  "pip install uv",
  "(cd backend && uv sync)",
  "(cd frontend && npm ci)"
]

[phases.build]
cmds = ["(cd frontend && npm run build)"]

[start]
cmd = "cd backend && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
